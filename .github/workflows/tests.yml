name: 单元测试

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 准备Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v
