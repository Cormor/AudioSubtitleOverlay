name: 发布 Windows 版本

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布 Windows 便携版
    if: startsWith(github.event.head_commit.message, '发布 v1.1.0')
    runs-on: windows-latest
    env:
      RELEASE_TAG: v1.1.0
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建 Windows 主程序
        shell: cmd
        run: call build_windows.bat

      - name: 创建发布压缩包
        shell: cmd
        run: call package_windows.bat

      - name: 校验并准备 Release 资产
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $mainSource = Get-ChildItem "releases\AudioSubtitleOverlay_精简版_*.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $tinySource = Get-ChildItem "releases\AudioSubtitleOverlay_tiny模型_*.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $mainSource) {
            throw "未找到主程序压缩包。"
          }
          if ($null -eq $tinySource) {
            throw "未找到 tiny 模型压缩包。"
          }

          $assetDirectory = "release-assets"
          New-Item -ItemType Directory -Force -Path $assetDirectory | Out-Null
          $mainName = "AudioSubtitleOverlay_Portable_v1.1.0.zip"
          $tinyName = "AudioSubtitleOverlay_tiny_model_v1.1.0.zip"
          $mainAsset = Join-Path $assetDirectory $mainName
          $tinyAsset = Join-Path $assetDirectory $tinyName
          Copy-Item $mainSource.FullName $mainAsset -Force
          Copy-Item $tinySource.FullName $tinyAsset -Force

          python -c 'from zipfile import ZipFile; paths=[r"release-assets\AudioSubtitleOverlay_Portable_v1.1.0.zip", r"release-assets\AudioSubtitleOverlay_tiny_model_v1.1.0.zip"]; assert all(ZipFile(path).testzip() is None for path in paths)'

          $mainInfo = Get-Item $mainAsset
          $tinyInfo = Get-Item $tinyAsset
          if ($mainInfo.Length -gt 150000000) {
            throw "主程序压缩包超过 150,000,000 字节，停止发布。"
          }
          $mainSize = "{0:N0} bytes" -f $mainInfo.Length
          $tinySize = "{0:N0} bytes" -f $tinyInfo.Length
          $mainHash = (Get-FileHash -Algorithm SHA256 $mainAsset).Hash.ToLowerInvariant()
          $tinyHash = (Get-FileHash -Algorithm SHA256 $tinyAsset).Hash.ToLowerInvariant()

          $notes = Get-Content "docs\release-notes-template.md" -Raw
          $replacements = @{
            "{{VERSION}}" = $env:RELEASE_TAG
            "{{MAIN_NAME}}" = $mainName
            "{{TINY_NAME}}" = $tinyName
            "{{MAIN_SIZE}}" = $mainSize
            "{{TINY_SIZE}}" = $tinySize
            "{{MAIN_SHA256}}" = $mainHash
            "{{TINY_SHA256}}" = $tinyHash
          }
          foreach ($entry in $replacements.GetEnumerator()) {
            $notes = $notes.Replace($entry.Key, $entry.Value)
          }
          Set-Content "release-assets\RELEASE_NOTES.md" -Value $notes -Encoding utf8

          @"
          $mainHash  $mainName
          $tinyHash  $tinyName
          "@ | Set-Content "release-assets\SHA256SUMS.txt" -Encoding ascii

      - name: 创建或更新 GitHub Release 并上传资产
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:RELEASE_TAG
          $assets = @(
            "release-assets/AudioSubtitleOverlay_Portable_v1.1.0.zip",
            "release-assets/AudioSubtitleOverlay_tiny_model_v1.1.0.zip",
            "release-assets/SHA256SUMS.txt"
          )

          gh release create $tag @assets --repo $repo --title "AudioSubtitleOverlay $tag" --notes-file "release-assets\RELEASE_NOTES.md" --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag @assets --repo $repo --clobber
            gh release edit $tag --repo $repo --title "AudioSubtitleOverlay $tag" --notes-file "release-assets\RELEASE_NOTES.md"
          }
